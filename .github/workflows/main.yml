name: CI/CD Pipeline

on:
  push:
    branches: 
      - main
      - feature/*
  workflow_dispatch:
jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 5345
          POSTGRES_DB: futurisys_ml
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U $POSTGRES_USER"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_USER: postgres
      DB_PASSWORD: 5345
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: futurisys_ml
      DATABASE_URL: postgresql+psycopg2://postgres:5345@localhost:5432/futurisys_ml

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install sqlalchemy psycopg[binary] python-dotenv pytest pytest-cov

      - name: Wait for PostgreSQL to be ready
        env:
          PGPASSWORD: 5345
        run: |
          echo "Waiting for PostgreSQL..."
          until pg_isready -h localhost -p 5432 -U postgres; do
              sleep 2
          done
          echo "PostgreSQL is ready!"

      - name: Initialize database tables via SQLAlchemy
        env:
          DB_USER: postgres
          DB_PASSWORD: 5345
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: futurisys_ml
          DATABASE_URL: postgresql+psycopg2://postgres:5345@localhost:5432/futurisys_ml
        run: |
          python create_db.py

      - name: Run tests
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest --cov=app tests/
      # Étape pour construire l'image Docker
      - name: Build Docker image
        run: |
          docker build -t my-api-image:${{ github.sha }} .
